# Default tag filter for the JUnit Platform Launcher. This is picked up
# regardless of how tests are run (IDE "Run" on RunCucumberTest, or `mvn test`),
# unlike a system property set only via the Surefire plugin.
#
# Excludes @requires_root scenarios (GT-TC3/4/5): they need raw-socket scans
# and a controlled firewall environment. See README for the root opt-in.
cucumber.filter.tags=not @requires_root
