# pf rules for GT-TC3 / GT-TC4 (Nmap graph-based FILTERED test cases).
# Loaded into a dedicated anchor by setup.sh - never touches the system's
# main pf ruleset. Ports must match nmap.gt.tc3.port / nmap.gt.tc4.port
# (see PortStateSteps.java; defaults below).

# GT-TC3: silent drop -> Nmap sees no reply at all -> FILTERED (timeout path)
block drop quick proto tcp from any to any port 50003

# GT-TC4: reject with ICMP unreachable -> FILTERED (ICMP path)
# NOTE: must be return-icmp, not return-rst. A TCP RST makes Nmap report
# CLOSED, not FILTERED - the whole point of this rule is the ICMP reply.
block return-icmp(port-unr) quick proto tcp from any to any port 50004
